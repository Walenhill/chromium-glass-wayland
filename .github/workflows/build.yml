name: Build Chromium Glass

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Swap (12 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Package in Arch Linux Container
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/build" \
            -w /build \
            archlinux:base-devel bash -c "
              set -euo pipefail
              
              # Update keyring and package databases
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed git sudo
              
              # Set up non-root builder user
              useradd -m -G wheel builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /build
              
              # Configure git safe directory and build package
              su builder -c 'git config --global --add safe.directory \"*\"'
              su builder -c 'makepkg --noconfirm -s --needed'
            "

      - name: Generate Checksums
        run: |
          sha256sum *.pkg.tar.zst > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-glass-package
          path: |
            *.pkg.tar.zst
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
